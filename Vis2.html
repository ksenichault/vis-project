<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>French baby‑name popularity map — fast edition</title>

    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e0e0e0;
        --accent: #1976d2;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        background: var(--bg);
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      label {
        font-weight: 600;
      }
      input[type="text"],
      input[type="number"] {
        padding: 0.5rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      svg {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .dept {
        stroke: #fff;
        stroke-width: 0.7;
      }
      .tooltip {
        position: fixed;
        pointer-events: none;
        opacity: 0;
        z-index: 9999;
        background: #333;
        color: #fff;
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
        font-size: 0.8rem;
        white-space: nowrap;
        transition: opacity 0.15s ease-out;
      }
      .tag {
        background: #e0e0e0;
        padding: 0.35rem 0.7rem;
        border-radius: 9999px;
        cursor: pointer;
        user-select: none;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div style="margin-top: 0.5rem; margin-bottom: 0.5rem">
        <label
          >Year from
          <input id="yearFrom" type="number" min="1900" max="2020" value="1900"
        /></label>
        <label
          >to
          <input id="yearTo" type="number" min="1900" max="2020" value="2020"
        /></label>
      </div>
      <div
        id="maps"
        style="
          display: flex;
          gap: 2rem;
          flex-wrap: wrap;
          justify-content: space-between;
        "
      >
        <div>
          <svg id="map" width="800" height="700"></svg>
          <div style="margin-top: 1rem" id="controls">
            <label
              >Name
              <input
                id="nameInput"
                type="text"
                placeholder="first name"
                autocomplete="off"
              />
              <datalist id="nameList"></datalist>
            </label>
            <div
              id="tagBar"
              style="
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
                max-width: 65%;
              "
            ></div>
          </div>
        </div>
        <div>
          <!-- <div id="popLegend" style="margin-bottom: 1rem; display: flex"></div> -->
          <svg id="popMap" width="800" height="700"></svg>
          <div id="popLegend" style="margin-top: 1rem; display: flex"></div>
        </div>
      </div>

      <!-- <div style="margin-top: 1rem">
        <label
          >Year from
          <input id="yearFrom" type="number" min="1900" max="2020" value="1900"
        /></label>
        <label
          >to
          <input id="yearTo" type="number" min="1900" max="2020" value="2020"
        /></label>
      </div> -->
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      (async function () {
        const CSV = "./data/dpt2020.csv",
          GEO = "./data/departements-version-simplifiee.geojson";
        const YEARS = { min: 1900, max: 2020 };
        const W = 800,
          H = 600;
        const mapDpt = {
          201: "2A",
          202: "2B", // modern codes (might be absent)
          20: "2A", // the old « single code » – we'll duplicate
          2: "2A", // just in case
          "2A": "2A",
          "2B": "2B", // already correct, keep as-is
        };
        function norm(code) {
          code = code.trim();
          if (code === "20" || code === "2") {
            // duplicate the line for each half of Corsica
            return Math.random() < 0.5 ? "2A" : "2B";
          }
          return mapDpt[code] || code; // fall through if nothing to change
        }
        const $nameInput = d3.select("#nameInput");
        const $nameList = d3.select("#nameList");
        const $yearFrom = d3.select("#yearFrom");
        const $yearTo = d3.select("#yearTo");
        const $tagBar = d3.select("#tagBar");
        const $tooltip = d3.select("#tooltip");
        const $mapSvg = d3.select("#map").attr("viewBox", [0, 0, W, H]);
        const $popSvg = d3.select("#popMap").attr("viewBox", [0, 0, W, H]);

        const geo = await d3.json(GEO);
        const proj = d3
          .geoConicConformal()
          .center([2.454071, 46.279229])
          .scale(2600)
          .translate([W / 2, H / 2]);
        proj.fitSize([W, H], geo);
        const path = d3.geoPath(proj);
        const mainDepts = $mapSvg
          .append("g")
          .selectAll("path")
          .data(geo.features)
          .enter()
          .append("path")
          .attr("class", "dept")
          .attr("d", path)
          .attr("fill", "#eee");
        const popDepts = $popSvg
          .append("g")
          .selectAll("path")
          .data(geo.features)
          .enter()
          .append("path")
          .attr("class", "dept")
          .attr("d", path)
          .attr("fill", "#fafafa")
          .attr("stroke", "#fff")
          .attr("stroke-width", 0.7);

        const raw = await d3.dsv(";", CSV, (d) => ({
          dpt: norm(d.dpt), // ← change is here
          name: d.preusuel.toUpperCase(),
          y: +d.annais,
          n: +d.nombre,
        }));
        console.log(
          "Distinct department codes in CSV:",
          Array.from(new Set(raw.map((r) => r.dpt))).sort()
        );

        const ALL_NAMES = Array.from(new Set(raw.map((r) => r.name))).sort();
        const cube = new Map();
        for (const { dpt, name, y, n } of raw) {
          let names = cube.get(dpt);
          if (!names) cube.set(dpt, (names = new Map()));
          let ps = names.get(name);
          if (!ps)
            names.set(name, (ps = new Uint32Array(YEARS.max - YEARS.min + 1)));
          ps[y - YEARS.min] += n;
        }
        cube.forEach((names) =>
          names.forEach((ps) => {
            for (let i = 1; i < ps.length; i++) ps[i] += ps[i - 1];
          })
        );
        const rangeSum = (ps, y0, y1) =>
          ps
            ? ps[y1 - YEARS.min] - (y0 > YEARS.min ? ps[y0 - YEARS.min - 1] : 0)
            : 0;

        const selected = new Set();
        let latestType = "";
        const debounce = (fn, ms = 200) => {
          let id;
          return (...a) => {
            clearTimeout(id);
            id = setTimeout(() => fn(...a), ms);
          };
        };

        $nameInput.on(
          "input",
          debounce(() => {
            latestType = $nameInput.property("value").trim().toUpperCase();
            const q = latestType;
            const sugg = (
              q ? ALL_NAMES.filter((n) => n.startsWith(q)) : ALL_NAMES
            ).slice(0, 10);
            $nameList
              .selectAll("option")
              .data(sugg)
              .join("option")
              .attr("value", (d) => d[0] + d.slice(1).toLowerCase());
            $nameInput.attr("list", "nameList");
            refresh();
          })
        );
        $nameInput.on("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addTag();
          }
        });
        $nameInput.on("change", addTag);

        function addTag() {
          const cand = $nameInput.property("value").trim().toUpperCase();
          if (cand && ALL_NAMES.includes(cand) && !selected.has(cand)) {
            selected.add(cand);
            latestType = "";
            $nameInput.property("value", "");
            renderTags();
            refresh();
          }
        }
        function renderTags() {
          $tagBar
            .selectAll("span.tag")
            .data(Array.from(selected), (d) => d)
            .join((enter) =>
              enter
                .append("span")
                .attr("class", "tag")
                .text((d) => d[0] + d.slice(1).toLowerCase() + " ×")
                .on("click", (_, d) => {
                  selected.delete(d);
                  renderTags();
                  refresh();
                })
            );
        }

        const defs = $mapSvg.append("defs");
        const grad = defs
          .append("linearGradient")
          .attr("id", "legendGrad")
          .attr("x1", 0)
          .attr("y1", 1)
          .attr("x2", 0)
          .attr("y2", 0);
        grad
          .selectAll("stop")
          .data(d3.range(0, 1.001, 0.1))
          .enter()
          .append("stop")
          .attr("offset", (d) => d)
          .attr("stop-color", "#eee");
        const legendScale = d3.scaleLinear().range([200, 0]);
        const legendAxis = $mapSvg
          .append("g")
          .attr("transform", "translate(725,20)");
        $mapSvg
          .append("rect")
          .attr("x", 700)
          .attr("y", 20)
          .attr("width", 18)
          .attr("height", 200)
          .attr("fill", "url(#legendGrad)")
          .attr("stroke", "#666")
          .attr("stroke-width", 0.5);

        // simple tooltip helpers
        function showTip(html, x, y) {
          $tooltip
            .style("opacity", 1)
            .style("left", x + 15 + "px")
            .style("top", y + 15 + "px")
            .html(html);
        }
        function hideTip() {
          $tooltip.style("opacity", 0);
        }

        function updateMain() {
          const yF = +$yearFrom.property("value"),
            yT = +$yearTo.property("value");
          const sel = selected.size
            ? Array.from(selected)
            : latestType
            ? [latestType]
            : [];
          const fillPct = new Map(),
            details = new Map();
          cube.forEach((names, dpt) => {
            let denom = 0;
            names.forEach((ps) => (denom += rangeSum(ps, yF, yT)));
            if (!denom) denom = 1;
            const rows = Array.from(names, ([n, ps]) => [
              n,
              rangeSum(ps, yF, yT) / denom,
            ])
              .filter((r) => r[1] > 0)
              .sort((a, b) => d3.descending(a[1], b[1]));
            let acc = 0,
              det = [];
            for (const n of sel) {
              const i = rows.findIndex((r) => r[0] === n);
              if (i !== -1) {
                const pct = rows[i][1];
                acc += pct;
                det.push([n, pct, i + 1]);
              }
            }
            fillPct.set(dpt, acc);
            details.set(dpt, det);
          });
          const maxPct = d3.max(fillPct.values()) || 0.01;
          const col = d3.scaleSequential([0, maxPct], d3.interpolateBlues);
          grad.selectAll("stop").attr("stop-color", (d) => col(d * maxPct));
          legendScale.domain([0, maxPct]);
          legendAxis.call(
            d3.axisRight(legendScale).ticks(6).tickFormat(d3.format(".0%"))
          );

          mainDepts
            .attr("fill", (d) => col(fillPct.get(d.properties.code) || 0))
            .on("mousemove", (e, d) => {
              const rows = details.get(d.properties.code) || [];
              const html =
                `<strong>${d.properties.nom} (${d.properties.code})</strong><br>` +
                rows
                  .map(
                    ([n, p, r]) =>
                      `#${r} ${n[0]}${n.slice(1).toLowerCase()}: <strong>${(
                        p * 100
                      ).toFixed(1)} %</strong>`
                  )
                  .join("<br>");
              showTip(html, e.pageX, e.pageY);
            })
            .on("mouseout", hideTip);
        }

        function updatePop() {
          const yF = +$yearFrom.property("value"),
            yT = +$yearTo.property("value");
          const top = new Map(),
            winner = new Map();
          cube.forEach((names, dpt) => {
            let tot = 0,
              arr = [];
            names.forEach((ps, n) => {
              const s = rangeSum(ps, yF, yT);
              if (s) {
                tot += s;
                arr.push([n, s]);
              }
            });
            if (!tot) return;
            arr.forEach((d) => (d[1] = d[1] / tot));
            arr.sort((a, b) => d3.descending(a[1], b[1]));
            top.set(dpt, arr.slice(0, 5));
            winner.set(dpt, arr[0][0]);
          });
          const nameTotals = new Map();
          let nationalTotal = 0;

          cube.forEach((names) => {
            names.forEach((ps, n) => {
              const s = rangeSum(ps, yF, yT);
              if (s) {
                nationalTotal += s;
                nameTotals.set(n, (nameTotals.get(n) || 0) + s);
              }
            });
          });
          const winners = Array.from(new Set(winner.values())).sort((a, b) =>
            d3.descending(nameTotals.get(a), nameTotals.get(b))
          );

          const palette =
            winners.length <= 10
              ? d3.schemeTableau10
              : d3
                  .range(winners.length)
                  .map((i) => d3.interpolateRainbow(i / winners.length));

          const catCol = d3.scaleOrdinal(winners, palette).unknown("#d0d0d0");

          popDepts
            .attr("fill", (d) => catCol(winner.get(d.properties.code)))
            .on("mousemove", (e, d) => {
              const arr = top.get(d.properties.code);
              // console.log(d.properties.code, winner.get(d.properties.code));

              if (!arr) return;

              const html = arr
                ? `<strong>${d.properties.nom} (${d.properties.code})</strong><br>` +
                  arr
                    .map(
                      ([n, p]) =>
                        `${n[0]}${n.slice(1).toLowerCase()}: <strong>${(
                          p * 100
                        ).toFixed(1)}%</strong>`
                    )
                    .join("<br>")
                : `<strong>${d.properties.nom} (${d.properties.code})</strong><br><em>No data</em>`;
              showTip(html, e.pageX, e.pageY);
            })
            .on("mouseout", hideTip);

          /* ---------- LEGEND ---------------------------------------- */
          const $leg = d3.select("#popLegend");
          $leg.selectAll("*").remove();

          /* caption explaining the numbers */
          $leg
            .append("div")
            // .style("font-size", ".75rem")
            .style("margin-bottom", ".3rem")
            .text(
              "Nation-wide ranking – share of all births in the selected period:"
            );

          const row = $leg
            .append("div")
            .style("display", "flex")
            .style("flex-direction", "column")
            .style("gap", ".25rem");

          winners.forEach((n, i) => {
            const pct = (100 * nameTotals.get(n)) / nationalTotal;

            const item = row
              .append("div")
              .style("display", "flex")
              .style("align-items", "center")
              .style("gap", ".4rem")
              .style("font-size", ".8rem");

            /* rank */
            item
              .append("span")
              .style("width", "2rem")
              .style("text-align", "right")
              .style("font-weight", "600")
              .text(`#${i + 1}`);

            /* colour swatch */
            item
              .append("span")
              .style("width", ".9rem")
              .style("height", ".9rem")
              .style("background", catCol(n))
              .style("border", "1px solid #999");

            /* name + percentage */
            item
              .append("span")
              .text(`${n[0]}${n.slice(1).toLowerCase()}  ${pct.toFixed(1)} %`);
          });
          /* ---------------------------------------------------------- */
        }

        function refresh() {
          updateMain();
          updatePop();
        }
        d3.selectAll("#yearFrom,#yearTo").on("input", () => {
          let f = +$yearFrom.property("value"),
            t = +$yearTo.property("value");
          f = Math.max(YEARS.min, Math.min(YEARS.max, f));
          t = Math.max(YEARS.min, Math.min(YEARS.max, t));
          if (t < f) [f, t] = [t, f];
          $yearFrom.property("value", f);
          $yearTo.property("value", t);
          refresh();
        });
        $nameList
          .selectAll("option")
          .data(ALL_NAMES.slice(0, 10))
          .enter()
          .append("option")
          .attr("value", (d) => d[0] + d.slice(1).toLowerCase());
        refresh();
      })();
    </script>
  </body>
</html>
